name: tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests with coverage gate
        run: |
          pytest tests/ --cov=src --cov=main --cov-report=term-missing --cov-fail-under=80

  # Eigener Job, bewusst getrennt vom Coverage-Lauf: er verschickt eine ECHTE
  # E-Mail und prueft damit den SENDGRID_API_KEY aus den GitHub-Secrets. Das ist
  # ein anderer Wert als der lokale .env-Key -- nur dieser hier entscheidet, ob
  # im Produktivbetrieb Mails ankommen. Anlass: am 2026-07-29 lief ein
  # vollstaendiger pre_market fuer 3,31 EUR durch und scheiterte erst beim
  # Versand mit HTTP 401, weil der Key abgelaufen war.
  # Faellt der Job rot aus, ist die Zustellung kaputt -- der Coverage-Job oben
  # bleibt davon unberuehrt.
  email-delivery:
    runs-on: ubuntu-latest
    env:
      SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
      EMAIL_FROM:       ${{ secrets.EMAIL_FROM }}
      EMAIL_TO:         ${{ secrets.EMAIL_TO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Send test email and log the outcome
        run: |
          pytest tests/live --run-live-email -v
