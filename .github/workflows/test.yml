name: tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests with coverage gate
        run: |
          pytest tests/ --cov=src --cov=main --cov-report=term-missing --cov-fail-under=80

  # Eigener Job, bewusst getrennt vom Coverage-Lauf: er spricht die echten APIs
  # an und prueft die Zugangsdaten aus den GitHub-SECRETS. Das sind andere Werte
  # als die lokalen .env-Eintraege -- im Normalfall identisch, aber sie koennen
  # einzeln ablaufen, und nur diese hier entscheiden, ob die geplanten Laeufe
  # durchkommen.
  #
  # Faellt der Job rot aus, ist eine Verbindung kaputt -- der Coverage-Job oben
  # bleibt davon unberuehrt.
  live-api-checks:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
      FINNHUB_API_KEY:        ${{ secrets.FINNHUB_API_KEY }}
      CAPITAL_COM_API_KEY:    ${{ secrets.CAPITAL_COM_API_KEY }}
      CAPITAL_COM_IDENTIFIER: ${{ secrets.CAPITAL_COM_IDENTIFIER }}
      CAPITAL_COM_PASSWORD:   ${{ secrets.CAPITAL_COM_PASSWORD }}
      SENDGRID_API_KEY:       ${{ secrets.SENDGRID_API_KEY }}
      EMAIL_FROM:             ${{ secrets.EMAIL_FROM }}
      EMAIL_TO:               ${{ secrets.EMAIL_TO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # Getrennte Steps, damit in der Job-Uebersicht sofort sichtbar ist, ob nur
      # der Versand haengt oder schon die Verbindungen. Die lesenden Pruefungen
      # laufen auch dann, wenn der Mailversand darunter scheitert.
      - name: Check API connections (read-only)
        run: |
          pytest tests/live -m live_api --run-live -v
      - name: Send test email and log the outcome
        if: always()
        run: |
          pytest tests/live -m live_email --run-live -v
