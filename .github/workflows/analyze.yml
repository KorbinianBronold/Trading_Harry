name: analyze
on:
  schedule:
    - cron: '0 13 * * 1-5'    # pre_market       15:00 Berlin (CEST)
    # trade_proposals haengt als einziger Lauf an der US-Eroeffnung, nicht an
    # Berlin: er soll 40 min danach liegen, also um 10:10 America/New_York.
    # Das sind 14:10 UTC, solange New York auf EDT steht, und 15:10 UTC auf EST.
    # Beide Slots feuern ganzjaehrig (Cron ist UTC-fix); der Schritt
    # "Determine run_type" wirft den jeweils falschen weg.
    - cron: '10 14 * * 1-5'   # trade_proposals  10:10 New York (EDT)
    - cron: '10 15 * * 1-5'   # trade_proposals  10:10 New York (EST)
    - cron: '30 20 * * 1-5'   # close            22:30 Berlin (CEST)
    - cron: '0 18 * * 0'      # weekly           So 20:00 Berlin (CEST)

  workflow_dispatch:
    inputs:
      run_type:
        type: choice
        options: [pre_market, trade_proposals, close, weekly]
        default: close

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
      RESEND_API_KEY:         ${{ secrets.RESEND_API_KEY }}
      EMAIL_TO:               ${{ secrets.EMAIL_TO }}
      EMAIL_FROM:             ${{ secrets.EMAIL_FROM }}
      FINNHUB_API_KEY:        ${{ secrets.FINNHUB_API_KEY }}
      CAPITAL_COM_API_KEY:    ${{ secrets.CAPITAL_COM_API_KEY }}
      CAPITAL_COM_IDENTIFIER: ${{ secrets.CAPITAL_COM_IDENTIFIER }}
      CAPITAL_COM_PASSWORD:   ${{ secrets.CAPITAL_COM_PASSWORD }}
      GH_TOKEN:               ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure data dir
        run: mkdir -p data

      - name: Download tracking.db from Release db-latest (best effort)
        run: |
          gh release download db-latest --pattern "tracking.db" \
            --dir data/ || echo "No prior db-latest release — fresh start."

      - name: Determine run_type
        id: rt
        run: |
          if [ -n "${{ inputs.run_type }}" ]; then
            echo "type=${{ inputs.run_type }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "${{ github.event.schedule }}" in
            "0 13 * * 1-5")  T="pre_market" ;;
            "10 14 * * 1-5") T="trade_proposals" ;;
            "10 15 * * 1-5") T="trade_proposals" ;;
            "30 20 * * 1-5") T="close" ;;
            "0 18 * * 0")    T="weekly" ;;
            *)               T="close" ;;
          esac

          # Von den beiden trade_proposals-Slots ist immer nur einer richtig.
          # Massgeblich ist die US-Zeitzone, NICHT Europe/Berlin: EU und USA
          # schalten an verschiedenen Wochenenden um, in den Zwischenwochen
          # stimmt eine Berliner Rechnung nicht. 10:10 New York ist 14:10 UTC
          # unter EDT (-0400) und 15:10 UTC unter EST (-0500).
          # Ohne diesen Filter lief der Lauf von Anfang November bis Mitte Maerz
          # um 09:10 ET -- 20 Minuten VOR der Eroeffnung. Der Opening-Gap-Check
          # verglich dort zwei Pre-Open-Kurse und feuerte nie.
          if [ "$T" = "trade_proposals" ]; then
            NY_OFFSET=$(TZ=America/New_York date +%z)
            UTC_HOUR=$(date -u +%H)
            case "$NY_OFFSET:$UTC_HOUR" in
              "-0400:14"|"-0500:15") ;;
              *) echo "Slot $UTC_HOUR:10 UTC passt nicht zu New York ($NY_OFFSET)"\
                      "— uebersprungen, der andere Slot ist heute der richtige."
                 echo "type=" >> "$GITHUB_OUTPUT"
                 exit 0 ;;
            esac
          fi
          echo "type=$T" >> "$GITHUB_OUTPUT"

      - name: Run analysis
        if: steps.rt.outputs.type != ''
        run: python main.py --run-type ${{ steps.rt.outputs.type }}

      - name: Upload tracking.db to Release db-latest
        # B-10: bewusst always() statt success(). Die Analyse committet phasenweise;
        # bricht der Schritt danach ab -- etwa weil der Mailversand fehlschlaegt --
        # waere bei success() die gesamte Arbeit des Laufs verloren (Trends,
        # Marktkontext, Predictions, Sektor-Mapping, Kosten). Der hochgeladene
        # Stand ist schlimmstenfalls unvollstaendig, aber nie schlechter als der
        # vorherige. Der Job bleibt trotzdem rot, das Fehlersignal geht nicht verloren.
        #
        # Der uebersprungene DST-Slot ist ausgenommen: dort lief keine Analyse,
        # ein Upload wuerde nur den unveraenderten Stand neu hochladen.
        if: always() && steps.rt.outputs.type != ''
        run: |
          gh release view db-latest >/dev/null 2>&1 \
            || gh release create db-latest --title "DB latest" \
                 --notes "Auto-uploaded by analyze.yml"
          gh release upload db-latest data/tracking.db --clobber

      - name: Weekly DB snapshot (Sunday only)
        if: success() && steps.rt.outputs.type == 'weekly'
        run: |
          WEEK=$(date -u +%G-W%V)
          gh release create "db-$WEEK" data/tracking.db \
            --title "DB snapshot $WEEK" \
            --notes "Weekly snapshot generated by analyze.yml" \
            || echo "Snapshot already exists for $WEEK"